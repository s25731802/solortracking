<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mobile Solar System - Gesture & Touch</title>

  <!-- 3D Graphics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe Hand Tracking for Mobile -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      touch-action: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06000d;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Mobile Clean HUD */
    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 10;
      background: rgba(18, 4, 38, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(192, 132, 252, 0.35);
      border-radius: 12px;
      padding: 10px 14px;
      max-width: 62vw;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .hud h1 {
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      color: #f3e8ff;
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    .hud p {
      font-size: 0.68rem;
      color: #c084fc;
      line-height: 1.3;
    }
    .status-badge {
      display: inline-block;
      margin-top: 6px;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 12px;
      background: rgba(147, 51, 234, 0.25);
      border: 1px solid rgba(192, 132, 252, 0.4);
      color: #fbbf24;
    }

    /* Floating Camera PiP */
    .cam-box {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 10;
      background: rgba(18, 4, 38, 0.85);
      border: 1px solid rgba(192, 132, 252, 0.4);
      border-radius: 12px;
      padding: 4px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    #webcam {
      width: 95px;
      height: 75px;
      border-radius: 8px;
      object-fit: cover;
      transform: scaleX(-1);
      display: block;
      background: #000;
    }

    /* Start / Permissions Button for Mobile Browsers */
    #start-cam-btn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: linear-gradient(135deg, #9333ea, #ec4899);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 25px;
      font-size: 0.85rem;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="hud">
    <h1>Solar System</h1>
    <p>🖐 <b>Hand:</b> Move to tilt & orbit</p>
    <p>🤏 <b>Pinch:</b> Zoom in / Spread out</p>
    <p>📱 <b>Touch:</b> 1-finger orbit, 2-finger zoom</p>
    <span class="status-badge" id="status-badge">Tap Camera Below</span>
  </div>

  <div class="cam-box">
    <video id="webcam" autoplay playsinline muted></video>
  </div>

  <button id="start-cam-btn">Enable Hand Tracking</button>

  <div id="canvas-container"></div>

  <script>
    const statusBadge = document.getElementById('status-badge');
    const startBtn = document.getElementById('start-cam-btn');
    const video = document.getElementById('webcam');

    // --- 1. THREE.JS SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x06000d, 0.0035);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 40, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Light
    scene.add(new THREE.AmbientLight(0x4c1d95, 0.9));
    const sunLight = new THREE.PointLight(0xfff5eb, 4.0, 350, 0.8);
    scene.add(sunLight);

    // --- 2. SUPER SUN ---
    const sunGeo = new THREE.SphereGeometry(6.5, 32, 32);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xffedd5 });
    const sun = new THREE.Mesh(sunGeo, sunMat);
    scene.add(sun);

    const haloGeo = new THREE.SphereGeometry(8.2, 32, 32);
    const haloMat = new THREE.MeshBasicMaterial({
      color: 0xf59e0b,
      transparent: true,
      opacity: 0.45,
      side: THREE.BackSide
    });
    const halo = new THREE.Mesh(haloGeo, haloMat);
    scene.add(halo);

    const coronaGeo = new THREE.SphereGeometry(10.5, 32, 32);
    const coronaMat = new THREE.MeshBasicMaterial({
      color: 0xd946ef,
      transparent: true,
      opacity: 0.22,
      side: THREE.BackSide
    });
    const corona = new THREE.Mesh(coronaGeo, coronaMat);
    scene.add(corona);

    // --- 3. 7 PLANETS ---
    const specs = [
      { size: 1.0, dist: 14, speed: 0.038, color: 0xf97316 },
      { size: 1.5, dist: 20, speed: 0.026, color: 0xfacc15 },
      { size: 1.8, dist: 28, speed: 0.019, color: 0x38bdf8 },
      { size: 1.2, dist: 36, speed: 0.015, color: 0xef4444 },
      { size: 3.4, dist: 48, speed: 0.009, color: 0xe879f9 },
      { size: 2.8, dist: 62, speed: 0.006, color: 0xc084fc, ring: true },
      { size: 2.0, dist: 75, speed: 0.004, color: 0x818cf8 }
    ];

    const planets = [];
    specs.forEach(s => {
      // Orbit Ring
      const orbitGeo = new THREE.RingGeometry(s.dist - 0.12, s.dist + 0.12, 64);
      const orbitMat = new THREE.MeshBasicMaterial({ color: 0x7e22ce, side: THREE.DoubleSide, transparent: true, opacity: 0.35 });
      const orbit = new THREE.Mesh(orbitGeo, orbitMat);
      orbit.rotation.x = Math.PI / 2;
      scene.add(orbit);

      // Planet body
      const pGeo = new THREE.SphereGeometry(s.size, 24, 24);
      const pMat = new THREE.MeshStandardMaterial({ color: s.color, roughness: 0.5 });
      const pMesh = new THREE.Mesh(pGeo, pMat);

      if (s.ring) {
        const rGeo = new THREE.RingGeometry(s.size + 1.1, s.size + 2.8, 32);
        const rMat = new THREE.MeshBasicMaterial({ color: 0xa855f7, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
        const rMesh = new THREE.Mesh(rGeo, rMat);
        rMesh.rotation.x = Math.PI / 2.3;
        pMesh.add(rMesh);
      }

      scene.add(pMesh);
      planets.push({ mesh: pMesh, dist: s.dist, speed: s.speed, angle: Math.random() * Math.PI * 2 });
    });

    // Cosmic Dust Particles
    const starCount = 1200;
    const starGeo = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount * 3);
    for (let i = 0; i < starCount * 3; i += 3) {
      starPos[i] = (Math.random() - 0.5) * 400;
      starPos[i + 1] = (Math.random() - 0.5) * 400;
      starPos[i + 2] = (Math.random() - 0.5) * 400;
    }
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xd8b4fe, size: 0.8, transparent: true, opacity: 0.6 })));

    // --- 4. CAMERA CONTROL STATE ---
    let targetAzimuth = 0;
    let targetElevation = 0.45;
    let targetDist = 95;
    let curAzimuth = 0;
    let curElevation = 0.45;
    let curDist = 95;

    // --- 5. MOBILE TOUCH FALLBACK ---
    let touchStartX = 0, touchStartY = 0;
    let initPinchDist = 0;
    let initTargetDist = 95;

    window.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        initPinchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initTargetDist = targetDist;
      }
    }, { passive: true });

    window.addEventListener('touchmove', e => {
      if (e.touches.length === 1) {
        const dx = e.touches[0].clientX - touchStartX;
        const dy = e.touches[0].clientY - touchStartY;
        targetAzimuth -= dx * 0.007;
        targetElevation = Math.max(0.1, Math.min(Math.PI / 2.2, targetElevation + dy * 0.007));
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        const curTouchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        const factor = initPinchDist / curTouchDist;
        targetDist = Math.max(25, Math.min(160, initTargetDist * factor));
      }
    }, { passive: true });

    // --- 6. MEDIAPIPE GESTURE HANDLER ---
    let hands;
    function initMediaPipe() {
      hands = new Hands({
        locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0, // 0 = Lite (Optimized for Mobile Battery & CPU)
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      hands.onResults(results => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          statusBadge.textContent = "Hand Tracked";
          statusBadge.style.color = "#4ade80";

          const lm = results.multiHandLandmarks[0];
          const index = lm[8];
          const thumb = lm[4];

          // 1. Tilt/Orbit with Index Tip
          targetAzimuth = (index.x - 0.5) * Math.PI * 2.2;
          targetElevation = 0.15 + (index.y * 1.05);

          // 2. Pinch Zoom
          const pDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
          const factor = Math.max(0, Math.min(1, (pDist - 0.04) / 0.16));
          targetDist = 28 + factor * 95;
        } else {
          statusBadge.textContent = "Looking for Hand...";
          statusBadge.style.color = "#fbbf24";
        }
      });
    }

    // Explicit User Interaction to unlock Camera on iOS Safari / Mobile Chrome
    startBtn.addEventListener('click', async () => {
      try {
        startBtn.style.display = 'none';
        statusBadge.textContent = "Starting Cam...";
        initMediaPipe();

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user", // Uses front selfie camera
            width: { ideal: 320 },
            height: { ideal: 240 }
          },
          audio: false
        });

        video.srcObject = stream;
        video.onloadedmetadata = () => {
          video.play();
          statusBadge.textContent = "Show Hand";

          async function processFrame() {
            if (video.readyState >= 2) {
              await hands.send({ image: video });
            }
            requestAnimationFrame(processFrame);
          }
          processFrame();
        };
      } catch (err) {
        statusBadge.textContent = "Cam Denied (Use Touch)";
        statusBadge.style.color = "#f87171";
        console.warn("Camera failed:", err);
      }
    });

    // --- 7. ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);

      // Rotate Sun
      sun.rotation.y += 0.003;
      const pulse = 1.0 + Math.sin(Date.now() * 0.003) * 0.04;
      halo.scale.set(pulse, pulse, pulse);
      corona.scale.set(pulse, pulse, pulse);

      // Orbit Planets
      planets.forEach(p => {
        p.angle += p.speed;
        p.mesh.position.x = Math.cos(p.angle) * p.dist;
        p.mesh.position.z = Math.sin(p.angle) * p.dist;
        p.mesh.rotation.y += 0.02;
      });

      // Smooth camera motion
      curAzimuth += (targetAzimuth - curAzimuth) * 0.06;
      curElevation += (targetElevation - curElevation) * 0.06;
      curDist += (targetDist - curDist) * 0.06;

      camera.position.x = Math.sin(curAzimuth) * Math.cos(curElevation) * curDist;
      camera.position.y = Math.sin(curElevation) * curDist;
      camera.position.z = Math.cos(curAzimuth) * Math.cos(curElevation) * curDist;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }
    animate();

    // Responsive screen resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
